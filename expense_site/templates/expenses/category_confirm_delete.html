{% extends 'expenses/base.html' %}
{% block title %}Delete Category • Expense Manager{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">Delete Category</h1>
<p class="mb-4 text-gray-600">Are you sure you want to delete this category?</p>
<form method="post" class="bg-white shadow rounded-lg p-6 space-y-4">
  {% csrf_token %}
  <div class="flex justify-end gap-3">
    <a href="{% url 'category_list' %}" class="px-4 py-2 text-sm rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50">Cancel</a>
    <button class="px-4 py-2 text-sm rounded-md bg-red-600 text-white hover:bg-red-500" type="submit">Delete</button>
  </div>
</form>
{% endblock %}
