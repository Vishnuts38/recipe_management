<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Expense Manager{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-full bg-gray-50">
  <nav class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between">
        <div class="flex items-center gap-6">
          <a class="text-lg font-semibold" href="{% url 'dashboard' %}">Expense Manager</a>
          <a class="text-sm text-gray-600 hover:text-gray-900" href="{% url 'expense_list' %}">Expenses</a>
          <a class="text-sm text-gray-600 hover:text-gray-900" href="{% url 'category_list' %}">Categories</a>
        </div>
        <div class="flex items-center gap-4">
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button class="text-sm text-gray-600 hover:text-gray-900" type="submit">Logout</button>
          </form>
        </div>
      </div>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
